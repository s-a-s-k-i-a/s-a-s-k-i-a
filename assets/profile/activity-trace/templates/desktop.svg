<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="at-title at-desc">
<title id="at-title">Activity Trace — private-inclusive GitHub aggregates</title>
<desc id="at-desc">A paper-craft bar chart: a short public commit bar above a much larger bar outside public view; both signals merge and flow to an A- activity rank seal.</desc>
<defs>
  <linearGradient id="g-bg" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#E7E0F3"></stop><stop offset="1" stop-color="#DED5EE"></stop>
  </linearGradient>
  <linearGradient id="g-floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E7DECA"></stop><stop offset="0.22" stop-color="#F3EDDD"></stop><stop offset="0.55" stop-color="#FAF6EB"></stop><stop offset="1" stop-color="#FDFBF3"></stop>
  </linearGradient>
  <linearGradient id="g-inshadow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#463478" stop-opacity="0.22"></stop><stop offset="1" stop-color="#463478" stop-opacity="0"></stop>
  </linearGradient>
  <linearGradient id="g-coral" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F6AE95"></stop><stop offset="1" stop-color="#EF9078"></stop>
  </linearGradient>
  <linearGradient id="g-stream" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A9DABF"></stop><stop offset="1" stop-color="#C2AFE9"></stop>
  </linearGradient>
  <radialGradient id="g-seal" cx="0.5" cy="0.42" r="0.75">
    <stop offset="0" stop-color="#F6F1FD"></stop><stop offset="1" stop-color="#E5DAF6"></stop>
  </radialGradient>
  <filter id="f-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"></feTurbulence>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.19  0 0 0 0 0.38  0 0 0 0.55 0"></feColorMatrix>
  </filter>
  <filter id="f-shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#322a6f" flood-opacity="0.20"></feDropShadow>
  </filter>
  <filter id="f-lift" x="-20%" y="-40%" width="140%" height="200%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4a3a80" flood-opacity="0.22"></feDropShadow>
  </filter>
  <clipPath id="clip-recess"><rect x="64" y="148" width="700" height="216" rx="46"></rect></clipPath>
</defs>

<g id="background">
  <rect x="0" y="0" width="1280" height="420" rx="28" fill="url(#g-bg)"></rect>
  <rect x="1" y="1" width="1278" height="418" rx="27" fill="none" stroke="#322a6f" stroke-opacity="0.22" stroke-width="1.5"></rect>
</g>
<g id="paper-texture">
  <rect x="0" y="0" width="1280" height="420" rx="28" filter="url(#f-grain)" opacity="0.04"></rect>
</g>

<g font-family="'Google Sans 18pt',sans-serif">

  <g id="header">
    <text x="72" y="66" font-size="14" font-weight="700" letter-spacing="2.6" fill="#584D97">ACTIVITY TRACE · PRIVATE-INCLUSIVE AGGREGATES</text>
    <text x="71" y="106" font-size="31" font-weight="700" letter-spacing="-0.3" fill="#2E2766">The work behind the public graph</text>
  </g>

  <g id="recess">
    <rect x="64" y="148" width="700" height="216" rx="46" fill="url(#g-floor)"></rect>
    <g clip-path="url(#clip-recess)">
      <rect x="64" y="148" width="700" height="52" fill="url(#g-inshadow)"></rect>
    </g>
    <rect x="64" y="148" width="700" height="216" rx="46" fill="none" stroke="#B3A3D3" stroke-width="1.5"></rect>
    <rect x="62" y="146" width="704" height="220" rx="48" fill="none" stroke="#F3EDFB" stroke-width="1.6" stroke-opacity="0.9"></rect>
  </g>


  <g id="public-layer">
    <text x="100" y="178" font-size="13" font-weight="700" letter-spacing="2" fill="#3A2F55">PUBLIC COMMITS · <tspan id="public-commits" font-size="16" letter-spacing="0.4">195</tspan></text>
    <rect x="100" y="188" width="628" height="22" rx="11" fill="#322a6f" fill-opacity="0.06"></rect>
    <rect data-role="public-fill" x="100" y="188" width="34" height="22" rx="11" fill="url(#g-coral)" stroke="#322a6f" stroke-width="2" filter="url(#f-lift)"></rect>
  </g>


  <g id="outside-public-layer">
    <text x="98" y="254" font-weight="700" fill="#2E2766"><tspan id="outside-public-percent" font-size="52">95</tspan><tspan font-size="30" dy="-2">%</tspan></text>
    <text x="212" y="254" font-size="19" font-weight="700" letter-spacing="3" fill="#2E2766">OUTSIDE PUBLIC VIEW</text>
    <text x="100" y="342" font-size="15" fill="#4A4171"><tspan id="outside-public-commits">3,612</tspan> of <tspan data-dyn="total-commits">3,807</tspan> commits</text>
    <rect x="100" y="268" width="628" height="46" rx="23" fill="#322a6f" fill-opacity="0.06"></rect>
    <rect data-role="outside-fill" x="100" y="268" width="596" height="46" rx="23" fill="url(#g-stream)" stroke="#322a6f" stroke-width="2.5" filter="url(#f-lift)"></rect>
  </g>


  <path id="signal-public" d="M 144 199 H 706 C 732 199 748 218 757 239" fill="none" stroke="#322a6f" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0.1 13" opacity="0.5"></path>
  <path id="signal-outside" d="M 150 291 H 700 C 728 291 746 279 756 267" fill="none" stroke="#322a6f" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="0.1 15" opacity="0.5"></path>

  <g id="merge-point">
    <circle cx="764" cy="254" r="17" fill="#FFFFFF" stroke="#322a6f" stroke-width="3.5" filter="url(#f-lift)"></circle>
  </g>
  <path id="signal-merged" d="M 786 254 C 830 252 862 240 898 229" fill="none" stroke="#322a6f" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 15"></path>

  <g id="rank-seal" transform="translate(998,224)">
    <circle r="94" fill="#FDFDFC" stroke="#322a6f" stroke-width="3" filter="url(#f-shadow)"></circle>
    <circle r="76" fill="url(#g-seal)"></circle>
    <circle r="64" fill="none" stroke="#B79BE8" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 11"></circle>
    <circle cx="66" cy="-66" r="7" fill="#EFC97F" stroke="#322a6f" stroke-width="2.5"></circle>
    <text y="-36" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2.4" fill="#2E2766" stroke="#F1EAFB" stroke-width="8" stroke-linejoin="round" paint-order="stroke">ACTIVITY RANK</text>
    <text id="rank" y="30" text-anchor="middle" font-size="68" font-weight="700" fill="#2E2766">A-</text>
    <text y="60" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#584D97" stroke="#E9DEF7" stroke-width="8" stroke-linejoin="round" paint-order="stroke">TOP <tspan id="percentile">35.3</tspan>%</text>
  </g>

  <g id="metrics-strip">
    <rect x="806" y="336" width="424" height="52" rx="26" fill="#FDFDFC" stroke="#322a6f" stroke-width="2.5" filter="url(#f-lift)"></rect>
    <line x1="947" y1="346" x2="947" y2="378" stroke="#322a6f" stroke-opacity="0.25" stroke-width="1.5"></line>
    <line x1="1089" y1="346" x2="1089" y2="378" stroke="#322a6f" stroke-opacity="0.25" stroke-width="1.5"></line>
    <text x="876" y="357" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.8" fill="#584D97">COMMITS</text>
    <text id="total-commits" x="876" y="378" text-anchor="middle" font-size="17" font-weight="700" fill="#2E2766">3,807</text>
    <text x="1018" y="357" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.8" fill="#584D97">PULL REQUESTS</text>
    <text id="pull-requests" x="1018" y="378" text-anchor="middle" font-size="17" font-weight="700" fill="#2E2766">962</text>
    <text x="1159" y="357" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.8" fill="#584D97">ISSUES</text>
    <text id="issues" x="1159" y="378" text-anchor="middle" font-size="17" font-weight="700" fill="#2E2766">1,869</text>
  </g>

  <text x="72" y="402" font-size="11" font-weight="600" letter-spacing="1.6" fill="#6B6191">GITHUB-README-STATS HEURISTIC · AGGREGATES ONLY · NO PRIVATE NAMES OR CODE</text>
</g>

<g id="true-north">
  <image data-role="true-north-logo" x="1098" y="2" width="128" height="128" preserveAspectRatio="xMidYMid meet" href="{{LOGO_DATA_URI}}"></image>
</g>
</svg>
