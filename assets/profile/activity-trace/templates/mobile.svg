<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="atm-title atm-desc">
<title id="atm-title">Activity Trace — GitHub contributions and separate search aggregates</title>
<desc id="atm-desc">Mobile paper-craft composition leading with all-time and rolling-year GitHub contributions. A smaller commit-search trace flows to a separately labelled GitHub Readme Stats rank.</desc>
<defs>
  <linearGradient id="g-bg" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#E7E0F3"></stop><stop offset="1" stop-color="#DED5EE"></stop>
  </linearGradient>
  <linearGradient id="g-floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E7DECA"></stop><stop offset="0.22" stop-color="#F3EDDD"></stop><stop offset="0.55" stop-color="#FAF6EB"></stop><stop offset="1" stop-color="#FDFBF3"></stop>
  </linearGradient>
  <linearGradient id="g-inshadow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#463478" stop-opacity="0.22"></stop><stop offset="1" stop-color="#463478" stop-opacity="0"></stop>
  </linearGradient>
  <linearGradient id="g-stream" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A9DABF"></stop><stop offset="0.54" stop-color="#B7D5D4"></stop><stop offset="1" stop-color="#C2AFE9"></stop>
  </linearGradient>
  <linearGradient id="g-coral" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F6AE95"></stop><stop offset="1" stop-color="#EF9078"></stop>
  </linearGradient>
  <radialGradient id="g-seal" cx="0.5" cy="0.42" r="0.75">
    <stop offset="0" stop-color="#F6F1FD"></stop><stop offset="1" stop-color="#E5DAF6"></stop>
  </radialGradient>
  <filter id="f-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"></feTurbulence>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.19  0 0 0 0 0.38  0 0 0 0.55 0"></feColorMatrix>
  </filter>
  <filter id="f-shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#322a6f" flood-opacity="0.20"></feDropShadow>
  </filter>
  <filter id="f-lift" x="-20%" y="-40%" width="140%" height="200%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4a3a80" flood-opacity="0.22"></feDropShadow>
  </filter>
  <clipPath id="clip-recess"><rect x="48" y="124" width="624" height="264" rx="42"></rect></clipPath>
</defs>

<g id="background">
  <rect x="0" y="0" width="720" height="680" rx="28" fill="url(#g-bg)"></rect>
  <rect x="1" y="1" width="718" height="678" rx="27" fill="none" stroke="#322a6f" stroke-opacity="0.22" stroke-width="1.5"></rect>
</g>
<g id="paper-texture">
  <rect x="0" y="0" width="720" height="680" rx="28" filter="url(#f-grain)" opacity="0.04"></rect>
</g>

<g font-family="'Google Sans 18pt',sans-serif">
  <g id="header">
    <text x="48" y="56" font-size="14" font-weight="700" letter-spacing="2.1" fill="#584D97">ACTIVITY TRACE · GITHUB CONTRIBUTIONS</text>
    <text x="47" y="96" font-size="28" font-weight="700" letter-spacing="-0.3" fill="#2E2766">The work behind the public graph</text>
  </g>

  <g id="recess">
    <rect x="48" y="124" width="624" height="264" rx="42" fill="url(#g-floor)"></rect>
    <g clip-path="url(#clip-recess)">
      <rect x="48" y="124" width="624" height="52" fill="url(#g-inshadow)"></rect>
    </g>
    <rect x="48" y="124" width="624" height="264" rx="42" fill="none" stroke="#B3A3D3" stroke-width="1.5"></rect>
    <rect x="46" y="122" width="628" height="268" rx="44" fill="none" stroke="#F3EDFB" stroke-width="1.6" stroke-opacity="0.9"></rect>
  </g>

  <g id="contribution-layer">
    <text x="80" y="160" font-size="14" font-weight="700" letter-spacing="1.9" fill="#584D97">ALL-TIME CONTRIBUTIONS</text>
    <text id="all-time-contributions" x="76" y="226" font-size="64" font-weight="700" letter-spacing="-2" fill="#2E2766">6,908</text>

    <text x="422" y="160" font-size="13" font-weight="700" letter-spacing="1.5" fill="#584D97">LAST 12 MONTHS</text>
    <text id="rolling-contributions" x="420" y="202" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#2E2766">6,494</text>
    <text x="422" y="226" font-size="13" font-weight="600" letter-spacing="0.9" fill="#6B6191"><tspan id="rolling-percent">94</tspan>% OF ALL-TIME</text>

    <rect x="84" y="246" width="540" height="44" rx="22" fill="#E8E1F1" stroke="#322a6f" stroke-opacity="0.14" stroke-width="1.5"></rect>
    <rect data-role="rolling-fill" x="84" y="246" width="508" height="44" rx="22" fill="url(#g-stream)" stroke="#322a6f" stroke-width="2.5" filter="url(#f-lift)"></rect>
    <path d="M 108 268 H 600" fill="none" stroke="#322a6f" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0.1 13" opacity="0.43"></path>
  </g>

  <g id="commit-search-trace">
    <rect x="80" y="310" width="544" height="60" rx="28" fill="#FFFFFF" fill-opacity="0.72" stroke="#322a6f" stroke-opacity="0.18" stroke-width="1.2"></rect>
    <rect x="96" y="325" width="22" height="22" rx="11" fill="url(#g-coral)" stroke="#322a6f" stroke-width="1.8"></rect>
    <text x="132" y="335" font-size="14" font-weight="700" letter-spacing="1.5" fill="#584D97">SEPARATE COMMIT SEARCH</text>
    <text x="132" y="358" font-size="15.5" fill="#403764"><tspan id="public-commits" font-weight="700">196</tspan> public  ·  <tspan data-dyn="private-inclusive-commits" font-weight="700">3,885</tspan> private-inclusive</text>
  </g>

  <path id="search-signal" d="M 624 342 C 650 393 564 430 460 460" fill="none" stroke="#322a6f" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 14"></path>
  <circle cx="632" cy="362" r="16" fill="#FFFFFF" stroke="#322a6f" stroke-width="3.5" filter="url(#f-lift)"></circle>

  <g id="rank-seal" transform="translate(360,500)">
    <circle r="96" fill="#FDFDFC" stroke="#322a6f" stroke-width="3" filter="url(#f-shadow)"></circle>
    <circle r="78" fill="url(#g-seal)"></circle>
    <circle r="66" fill="none" stroke="#B79BE8" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 11"></circle>
    <circle cx="68" cy="-68" r="7" fill="#EFC97F" stroke="#322a6f" stroke-width="2.5"></circle>
    <text y="-38" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.7" fill="#2E2766" stroke="#F1EAFB" stroke-width="8" stroke-linejoin="round" paint-order="stroke">README-STATS RANK</text>
    <text id="rank" y="34" text-anchor="middle" font-size="78" font-weight="700" fill="#2E2766">A-</text>
    <text y="65" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="1.8" fill="#584D97" stroke="#E9DEF7" stroke-width="9" stroke-linejoin="round" paint-order="stroke">TOP <tspan id="percentile">35.3</tspan>%</text>
  </g>

  <text x="360" y="604" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6B6191">PRIVATE-INCLUSIVE SEARCH AGGREGATES</text>
  <g id="metrics-strip">
    <rect x="80" y="612" width="560" height="44" rx="22" fill="#FDFDFC" stroke="#322a6f" stroke-width="2.5" filter="url(#f-lift)"></rect>
    <line x1="266" y1="621" x2="266" y2="648" stroke="#322a6f" stroke-opacity="0.25" stroke-width="1.5"></line>
    <line x1="453" y1="621" x2="453" y2="648" stroke="#322a6f" stroke-opacity="0.25" stroke-width="1.5"></line>
    <text x="173" y="631" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#584D97">COMMITS</text>
    <text id="private-inclusive-commits" x="173" y="650" text-anchor="middle" font-size="17" font-weight="700" fill="#2E2766">3,885</text>
    <text x="360" y="631" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#584D97">PULL REQUESTS</text>
    <text id="pull-requests" x="360" y="650" text-anchor="middle" font-size="17" font-weight="700" fill="#2E2766">991</text>
    <text x="546" y="631" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#584D97">ISSUES</text>
    <text id="issues" x="546" y="650" text-anchor="middle" font-size="17" font-weight="700" fill="#2E2766">1,876</text>
  </g>

</g>

<g id="true-north">
  <image data-role="true-north-logo" x="552" y="0" width="122" height="122" preserveAspectRatio="xMidYMid meet" href="{{LOGO_DATA_URI}}"></image>
</g>
</svg>
